name: Deploy Django (Production - Gunicorn + PM2)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Sync code to runner workspace
      - name: Sync code
        run: |
          cd /home/ec2-user/actions-runner/_work/atomlift-be
          rsync -av --delete ./atomlift-be/ ./atomlift-be/
        shell: bash

      # 3️⃣ Install Python 3.11
      - name: Install Python
        run: |
          sudo dnf install -y python3.11 python3.11-devel gcc
        shell: bash

      # 4️⃣ Setup virtual environment
      - name: Setup venv
        run: |
          cd /home/ec2-user/actions-runner/_work/atomlift-be/atomlift-be
          rm -rf venv
          python3.11 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
        shell: bash

      # 5️⃣ Django migrate & collectstatic
      - name: Django migrate & collectstatic
        run: |
          cd /home/ec2-user/actions-runner/_work/atomlift-be/atomlift-be
          source venv/bin/activate
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
        shell: bash

      # 6️⃣ Ensure PM2 is installed
      - name: Ensure PM2
        run: |
          command -v pm2 || sudo npm install -g pm2
        shell: bash

      # 7️⃣ Start / Reload Gunicorn via PM2
      - name: Start / Reload Gunicorn
        run: |
          cd /home/ec2-user/actions-runner/_work/atomlift-be/atomlift-be
          source venv/bin/activate

          # Delete existing PM2 process if exists
          pm2 delete atom-backend || true

          # Start Gunicorn using venv Python
          pm2 start venv/bin/gunicorn \
            --name atom-backend \
            --interpreter /home/ec2-user/actions-runner/_work/atomlift-be/atomlift-be/venv/bin/python \
            -- \
            passenger_wsgi:application \
            --bind 127.0.0.1:8000 \
            --workers 3

          pm2 save
        shell: bash

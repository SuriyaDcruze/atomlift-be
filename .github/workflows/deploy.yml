name: Deploy Django (Production - Gunicorn + PM2)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 40

    steps:
      # -----------------------------
      # 1. CHECKOUT CODE INTO FIXED FOLDER
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: /var/www/atom-backend

      # -----------------------------
      # 2. INSTALL PYTHON + CREATE/REUSE VENV
      # -----------------------------
      - name: Setup Python & Virtual Environment
        run: |
          cd /var/www/atom-backend

          sudo dnf install -y python3.11 python3.11-devel gcc make

          if [ ! -d "venv" ]; then
            python3.11 -m venv venv
          fi

          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
        shell: bash

      # -----------------------------
      # 3. INSTALL REQUIREMENTS
      # -----------------------------
      - name: Install Requirements
        run: |
          cd /var/www/atom-backend
          source venv/bin/activate
          pip install -r requirements.txt
        shell: bash

      # -----------------------------
      # 4. CREATE/UPDATE .env FILE
      # -----------------------------
      - name: Create .env file
        run: |
          cd /var/www/atom-backend
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo "DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}" >> .env
          echo "DATABASE_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DATABASE_USER=${{ secrets.DB_USER }}" >> .env
          echo "DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DATABASE_HOST=${{ secrets.DB_HOST }}" >> .env
          echo "DATABASE_PORT=${{ secrets.DB_PORT }}" >> .env
        shell: bash

      # -----------------------------
      # 5. DJANGO MIGRATIONS
      # -----------------------------
      - name: Run Migrations
        run: |
          cd /var/www/atom-backend
          source venv/bin/activate
          python manage.py migrate --noinput
        shell: bash

      # -----------------------------
      # 6. COLLECT STATIC FILES
      # -----------------------------
      - name: Collect Static Files
        run: |
          cd /var/www/atom-backend
          source venv/bin/activate
          python manage.py collectstatic --noinput
        shell: bash

      # -----------------------------
      # 7. ENSURE PM2 INSTALLED
      # -----------------------------
      - name: Install PM2 if missing
        run: |
          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install -g pm2
          fi
        shell: bash

      # -----------------------------
      # 8. START / RELOAD GUNICORN
      # -----------------------------
      - name: Start / Reload Gunicorn
        run: |
          cd /var/www/atom-backend
          source venv/bin/activate

          if pm2 list | grep -q "atom-backend"; then
            pm2 reload atom-backend
          else
            pm2 start venv/bin/gunicorn \
              --name atom-backend \
              --bind 0.0.0.0:8000 \
              atomlift.wsgi:application
          fi

          pm2 save
        shell: bash
